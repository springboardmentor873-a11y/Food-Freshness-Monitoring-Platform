version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: food_freshness_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: food_freshness
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d food_freshness"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food_freshness_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=AI Food Freshness Monitoring API
      - APP_VERSION=1.0.0
      - API_PREFIX=/api/v1
      - JWT_SECRET_KEY=this_is_a_very_secure_secret_key_for_development_12345
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - MODEL_PATH=app/models/efficientnetb0.keras
      - UPLOAD_FOLDER=app/uploads
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgrespassword
      - POSTGRES_DB=food_freshness
      - MONGODB_URI=mongodb://localhost:27017
      - MONGODB_DATABASE=food_freshness_monitoring
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:80"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app/uploads:/app/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: food_freshness_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
